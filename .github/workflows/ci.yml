name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: 类型检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 单元与集成测试
        run: bun run test

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建应用
        run: bun run build

      - name: 安装 Playwright 系统依赖
        run: bunx playwright install-deps

      - name: 安装虚拟显示（Electron 在 Linux CI 需要 X11）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E 测试
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bun run test:e2e
        env:
          CI: true
