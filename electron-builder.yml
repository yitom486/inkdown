appId: com.markdown.editor
productName: 轻量阅读器
publish: null
directories:
  buildResources: resources
  output: release
# 渲染进程已由 Vite 打进 out/，主进程无 npm 依赖，无需整包 node_modules
files:
  - out/**/*
  - package.json
  - '!node_modules'
electronLanguages:
  - zh-CN
  - en-US

win:
  icon: resources/icon.ico
  target:
    - nsis

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  # 无 Apple 开发者证书时跳过公证；用户需在「隐私与安全性」中允许打开
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  icon: resources/icon.png
  category: Office
  maintainer: yitom486 <yitom486@gmail.com>
  desktop:
    entry:
      Name: 轻量阅读器
      Comment: Markdown 编辑与电子书阅读
      Categories: Office;TextEditor;
      Terminal: false
      Type: Application
  target:
    - AppImage
    - deb
