appId: com.inkdown.app
productName: Inkdown
publish:
  provider: github
  owner: yitom486
  repo: inkdown
directories:
  buildResources: resources
  output: release
# 渲染进程已由 Vite 打进 out/，主进程无 npm 依赖，无需整包 node_modules
files:
  - out/**/*
  - package.json
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/argparse/**/*
  - node_modules/sax/**/*
  - '!node_modules'
electronLanguages:
  - zh-CN
  - en-US

win:
  icon: resources/icon.ico
  target:
    - nsis

# 默认 oneClick 会一键装进 %LOCALAPPDATA%，没有选目录页
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 默认按当前用户安装（不强制管理员）；选 Program Files 等系统目录时仍会提权
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Inkdown
  installerLanguages:
    - zh_CN
    - en_US
  language: 2052
  # 卸载时保留阅读进度 / 书签，避免误清用户数据
  deleteAppDataOnUninstall: false

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  # 无 Apple 开发者证书时跳过公证；用户需在「隐私与安全性」中允许打开
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  icon: resources/icon.png
  category: Office
  maintainer: yitom486 <yitom486@gmail.com>
  desktop:
    entry:
      Name: Inkdown
      Comment: Markdown 编辑与电子书 / 在线文档阅读
      Categories: Office;TextEditor;
      Terminal: false
      Type: Application
  target:
    - AppImage
    - deb
